exec feh --bg-scale ~/.config/i3/.cache/current.png
exec_always ~/.config/polybar/launch.sh
exec ~/.config/i3/scripts/Colors.sh
exec ~/.config/i3/scripts/polkit.sh

# exec_always picom
exec greenclip daemon &

# Keyboard layout: French (AZERTY) and Arabic (AZERTY) with Alt+Shift toggle
exec_always --no-startup-id setxkbmap -model pc105 -layout fr,ara -variant azerty,azerty -option "" -option grp:alt_shift_toggle,grp_led:scroll

exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id xss-lock --transfer-sleep-lock -- i3lock --nofork
exec --no-startup-id nm-applet

exec --no-startup-id sh -c 'export QT_QPA_PLATFORMTHEME=qt6ct'

exec --no-startup-id xrandr --output HDMI-1 --mode 1366x768 --rate 60 --left-of eDP-1 --output eDP-1 --primary --mode 1920x1080 --rate 60
